networks:
  proxy:
    external: true
    name: home-codespaces_proxy

services:
  docbrain-db:
    image: pgvector/pgvector:pg16
    container_name: docbrain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_docbrain:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proxy

  docbrain-backend:
    build:
      context: ./backend
      target: dev
    container_name: docbrain-backend
    restart: unless-stopped
    env_file: .env
    # На code-server-хосте docker-daemon живёт снаружи контейнера code-server,
    # поэтому относительный bind ./backend резолвится в путь хоста, а не
    # внутри code-server. Передаём абсолютный хост-путь через переменную
    # BACKEND_HOST_PATH (см. .env); fallback ./backend — для чистых dev/CI окружений.
    volumes:
      - ${BACKEND_HOST_PATH:-./backend}:/app
    depends_on:
      docbrain-db:
        condition: service_healthy
    networks:
      - proxy

  docbrain-n8n:
    image: n8nio/n8n:latest
    container_name: docbrain-n8n
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.nikulshin-dev.online
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.nikulshin-dev.online/
      GENERIC_TIMEZONE: Europe/Moscow
      DOCBRAIN_API_KEY: ${DOCBRAIN_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - proxy

volumes:
  pgdata_docbrain:
  n8n_data:
